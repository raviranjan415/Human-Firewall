# ==============================================================================
# Common Hiera Baseline Data
# ==============================================================================
---
human_firewall::app_user: "appuser"
human_firewall::app_group: "appgroup"
human_firewall::app_uid: 10001
human_firewall::app_gid: 10001
human_firewall::app_port: 5000
human_firewall::http_port: 80

packages::base_list:
  - "curl"
  - "wget"
  - "git"
  - "htop"
  - "jq"
  - "ca-certificates"
  - "ufw"

ssh::port: 22
ssh::permit_root_login: "no"
ssh::password_authentication: "no"
ssh::client_alive_interval: 300
ssh::client_alive_count_max: 2

security_baseline::sysctl_tcp_syncookies: 1
security_baseline::sysctl_ip_forward: 1
security_baseline::sysctl_rp_filter: 1
security_baseline::file_limits_nofile: 65535

