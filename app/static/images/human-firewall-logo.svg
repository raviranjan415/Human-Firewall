<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none" width="100%" height="100%" aria-label="Human Firewall Logo">
  <defs>
    <!-- Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- SHIELD EMBLEM -->
  <g transform="translate(10, 10)">
    <!-- Outer Glow -->
    <path d="M50 4 L88 20 C88 56 68 84 50 96 C32 84 12 56 12 20 Z"
          fill="none" stroke="url(#shieldGrad)" stroke-width="4" filter="url(#shieldGlow)" opacity="0.6"/>

    <!-- Shield Background -->
    <path d="M50 6 L84 22 C84 54 66 80 50 92 C34 80 16 54 16 22 Z"
          fill="#090d16" stroke="url(#shieldGrad)" stroke-width="2.5" />

    <!-- Circuit traces on shield -->
    <path d="M24 35 H36 L44 43 V56" stroke="#06b6d4" stroke-width="1.5" stroke-linecap="round" opacity="0.75" />
    <circle cx="24" cy="35" r="2.5" fill="#22d3ee" />
    <circle cx="44" cy="56" r="2.5" fill="#22d3ee" />

    <path d="M76 35 H64 L56 43 V56" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" opacity="0.75" />
    <circle cx="76" cy="35" r="2.5" fill="#c084fc" />
    <circle cx="56" cy="56" r="2.5" fill="#c084fc" />

    <path d="M50 92 V76" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
    <circle cx="50" cy="76" r="2.5" fill="#60a5fa" />

    <!-- HUMAN SILHOUETTE (Cyber Defender) -->
    <!-- Head -->
    <circle cx="50" cy="36" r="9" fill="url(#shieldGrad)" />
    <circle cx="50" cy="36" r="6" fill="#f8fafc" />

    <!-- Shoulders & Torso with circuit cutout -->
    <path d="M34 66 C34 52 40 48 50 48 C60 48 66 52 66 66 C66 68 64 70 50 72 C36 70 34 68 34 66 Z"
          fill="url(#shieldGrad)" />
    <path d="M38 64 C39 55 43 51 50 51 C57 51 61 55 62 64 C60 65 55 66 50 66 C45 66 40 65 38 64 Z"
          fill="#f8fafc" />

    <!-- Firewall Heart / Core Node -->
    <polygon points="50,56 53,60 50,64 47,60" fill="#06b6d4" />
  </g>

  <!-- LOGO TEXT -->
  <g transform="translate(125, 26)">
    <!-- HUMAN FIREWALL Brand Name -->
    <text x="0" y="38" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="34" font-weight="900" letter-spacing="1.5" fill="url(#textGrad)">
      HUMAN <tspan fill="url(#glowGrad)">FIREWALL</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="60" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="12" font-weight="600" letter-spacing="2.8" fill="#94a3b8">
      CYBERSECURITY AWARENESS PLATFORM
    </text>
  </g>
</svg>
