---
- name: Install Nginx web server
  apt:
    name: nginx
    state: present

- name: Deploy load balanced nginx.conf template
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: '0644'
    validate: 'nginx -t -c %s'
  notify: reload nginx

- name: Ensure Nginx service is running and enabled
  service:
    name: nginx
    state: started
    enabled: yes

