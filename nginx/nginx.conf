# ==============================================================================
# Human Firewall — Nginx Load Balancer & Reverse Proxy Configuration
# High Availability Upstream Pooling across Flask Application Replicas
# ==============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging configuration with upstream response time tracking
    log_format  main_upstream  '$remote_addr - $remote_user [$time_local] "$request" '
                               '$status $body_bytes_sent "$http_referer" '
                               '"$http_user_agent" "$http_x_forwarded_for" '
                               'rt=$request_time urt=$upstream_response_time uaddr=$upstream_addr';

    access_log  /var/log/nginx/access.log  main_upstream;

    # TCP optimizations
    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    # Client limits
    client_max_body_size 8M;
    client_body_buffer_size 128k;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # --------------------------------------------------------------------------
    # Upstream Cluster: Flask Application Replicas
    # Least-Connections balancing with automatic failure isolation
    # --------------------------------------------------------------------------
    upstream human_firewall_cluster {
        least_conn;
        server app_replica_1:5000 max_fails=3 fail_timeout=10s;
        server app_replica_2:5000 max_fails=3 fail_timeout=10s;
        server app_replica_3:5000 max_fails=3 fail_timeout=10s backup;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # HTTP Server Configuration
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name localhost humanfirewall.local _;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Load Balancer Health Check
        location /lb-status {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy","load_balancer":"nginx","algorithm":"least_conn","upstream_replicas":3}';
        }

        # Static assets cache optimization
        location /static/ {
            proxy_pass http://human_firewall_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_cache_valid 200 302 10m;
            proxy_cache_valid 404 1m;
            expires 1d;
            add_header Cache-Control "public, no-transform";
        }

        # Reverse Proxy to Flask Replicas
        location / {
            proxy_pass http://human_firewall_cluster;
            proxy_http_version 1.1;

            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 8k;

            # Resilient failover to next replica on transient errors
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
        }
    }
}

