# ==============================================================================
# Human Firewall — Prometheus Scrape Configuration
# Observability Tier for Cluster Replicas, Nginx, and Host Infrastructure
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # ----------------------------------------------------------------------------
  # 1. Human Firewall Flask Replicas (Application Metrics)
  # ----------------------------------------------------------------------------
  - job_name: "human_firewall_replicas"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "app_replica_1:5000"
          - "app_replica_2:5000"
          - "app_replica_3:5000"
        labels:
          environment: "production"
          service: "human-firewall-wsgi"

  # ----------------------------------------------------------------------------
  # 2. Host Node Exporters (CPU, RAM, Disk, Network)
  # ----------------------------------------------------------------------------
  - job_name: "node_exporter"
    static_configs:
      - targets:
          - "localhost:9100"
        labels:
          environment: "production"
          tier: "infrastructure"

  # ----------------------------------------------------------------------------
  # 3. Prometheus Self-Monitoring
  # ----------------------------------------------------------------------------
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

